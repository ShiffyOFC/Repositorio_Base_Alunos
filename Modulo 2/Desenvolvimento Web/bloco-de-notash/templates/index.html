<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLOCO-DE-NOTAS-DO-ANTHONY</title>
    <style>
        li {
            animation: aparecer 0.3s ease forwards;
        }

        @keyframes aparecer {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div>
        <ui>
            {% for item in notas %}
            <li> {{item}} </li>
            {% endfor %}
        </ui>
        <form action="/" method="POST">
            <imput type="text" placeholder="Escreva sua anotação" id="nota" nome="nota">
                <imput type="submit" value="SALVAR">
        </form>
    </div>
</body>

</html>
